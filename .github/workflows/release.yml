name: Release

# Publishing a release: push a version tag (v3.0.0) or run this by hand against
# an existing tag. The job builds the plugin, packages the shipped bundle and
# attaches it to the release; GitHub adds the source archives itself.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (must already exist, e.g. v3.0.0)'
        required: true
        type: string
      allow_clobber:
        description: 'Replace the asset on a release that is already published (dangerous)'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, package and publish
    runs-on: ubuntu-latest
    # The only job in the repository that needs write access; everything else
    # runs with contents: read.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.15.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # vendor/ is gitignored but ships inside the bundle, so the release build
      # must generate it — production-only, no dev dependencies.
      - name: Install production PHP dependencies
        run: composer install --no-dev --no-interaction --no-progress

      - name: Resolve and check the tag
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Tag $TAG does not match package.json version v$VERSION." >&2
            echo "Bump the version (package.json, README stable tag, changelog.txt) first." >&2
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      # The short, installer-facing section at the top of changelog.txt, not the
      # full technical history and not GitHub's commit-by-commit notes.
      - name: Prepare release notes
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          awk -v heading="= $VERSION =" '
            $0 == heading { capture = 1; next }
            capture && /^= .* =$/ { exit }
            capture && /^Five Prayer — Changelog/ { exit }
            capture { print }
          ' changelog.txt > release-notes.md
          if [ -s release-notes.md ]; then
            echo "NOTES_FILE=release-notes.md" >> "$GITHUB_ENV"
          else
            echo "No release notes for $VERSION in changelog.txt — GitHub will generate them."
          fi

      - name: Build
        run: npm run build

      - name: Package the plugin
        run: npm run plugin:zip

      - name: Name the asset
        run: |
          set -euo pipefail
          mv fiveprayer.zip "fiveprayer-$TAG.zip"
          echo "ASSET=fiveprayer-$TAG.zip" >> "$GITHUB_ENV"
          ls -lh "fiveprayer-$TAG.zip"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Empty for a tag push, so only a manual run can opt in.
          ALLOW_CLOBBER: ${{ github.event.inputs.allow_clobber }}
        run: |
          set -euo pipefail
          NOTES_ARGS=()
          if [ -n "${NOTES_FILE:-}" ]; then
            NOTES_ARGS=(--notes-file "$NOTES_FILE")
          else
            NOTES_ARGS=(--generate-notes)
          fi

          if gh release view "$TAG" > /dev/null 2>&1; then
            # A published release is immutable unless a manual workflow_dispatch
            # run explicitly opted in. Silently replacing a shipped asset makes
            # the download and its checksum disagree.
            IS_DRAFT="$(gh release view "$TAG" --json isDraft --jq '.isDraft')"
            if [ "$IS_DRAFT" != "true" ] && [ "${ALLOW_CLOBBER:-false}" != "true" ]; then
              echo "Release $TAG is already published. Re-run with workflow_dispatch and allow_clobber=true to replace its asset." >&2
              exit 1
            fi

            gh release upload "$TAG" "$ASSET" --clobber
            gh release edit "$TAG" "${NOTES_ARGS[@]}"
          else
            gh release create "$TAG" "$ASSET" \
              --title "FivePrayer $TAG" \
              --verify-tag \
              "${NOTES_ARGS[@]}"
          fi
